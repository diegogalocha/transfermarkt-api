services:
  transfermarkt-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transfermarkt-api
    ports:
      - "8000:8000"
    environment:
      - RATE_LIMITING_ENABLE=false
      - RATE_LIMITING_FREQUENCY=0/1second
      - ZYTE_API_KEY=${ZYTE_API_KEY:-}
      - ZYTE_MODE=fallback
      - ZYTE_RENDER=true
      - ZYTE_GEOLOCATION=US
    restart: unless-stopped
